services:
  - type: web
    name: sakgaze-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.src.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sakgaze-db
          property: connectionString
      - key: CORS_ORIGINS
        value: "https://sakgaze.com,http://localhost:3000,http://127.0.0.1:3000"

databases:
  - name: sakgaze-db
    plan: free
    postgis: true
