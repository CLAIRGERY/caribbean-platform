# =============================================================================
# SaKgaZé — Nginx Reverse Proxy (Production)
# Domain: sakgaze.com
# =============================================================================

# --- HTTP → HTTPS redirect (port 80) ---
server {
    listen 80;
    listen [::]:80;
    server_name sakgaze.com www.sakgaze.com;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS server (port 443) ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sakgaze.com www.sakgaze.com;

    # SSL certificates (managed by Certbot)
    ssl_certificate     /etc/letsencrypt/live/sakgaze.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sakgaze.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        application/geo+json
        application/json
        text/plain
        text/css
        text/javascript
        application/javascript
        image/svg+xml
        application/xml;

    # Logs
    access_log /var/log/nginx/sakgaze-access.log;
    error_log  /var/log/nginx/sakgaze-error.log;

    # =========================================================================
    # Static frontend (aggressive cache for assets)
    # =========================================================================
    root /opt/sakgaze/frontend;
    index index.html;

    # Cache-busted assets: long expiry
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # HTML: no cache (always fresh)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # =========================================================================
    # API reverse proxy → FastAPI backend (127.0.0.1:8000)
    # =========================================================================
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long timeout for satellite processing & drift computations
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # Buffer large GeoJSON responses
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 8 256k;
        proxy_busy_buffers_size 256k;
    }

    # Health endpoint (no buffering, instant response)
    location /health {
        proxy_pass http://127.0.0.1:8000/health;
        proxy_buffering off;
    }
}
